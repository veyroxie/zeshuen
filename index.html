<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#141311">
  <!-- "Add to Home Screen" opens it full screen, with no browser bars -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Alyesa">
  <link rel="apple-touch-icon" href="Assets/Icon192.png">
  <title>Happy Birthday, Alyssa</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍓</text></svg>">
  <link rel="preload" href="Assets/Fonts/ElyesaHand.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="Assets/Rooms/Door.webp" as="image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=DM+Serif+Display&family=Itim&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Styles.css">
  <link rel="stylesheet" href="House.css">
  <link rel="stylesheet" href="Fridge.css">
  <script type="module" src="App.js"></script>
</head>
<body>
  <div class="stage" id="Stage">
    <!-- The front door. Its middle panel is a separate layer so it can swing open. -->
    <section class="view is-current" id="DoorView" aria-label="The front door">
      <div class="view__backdrop" style="background-image: url(Assets/Rooms/Door.webp)"></div>
      <div class="pan" id="DoorPan">
        <div class="scene" style="--ratio: 1200 / 1600">
          <img class="scene__photo" src="Assets/Rooms/Door.webp" alt="Our front door: pale wood panels with a long black handle">
          <div class="door-gap" id="DoorGap"></div>
          <div class="door-leaf" id="DoorLeaf"><p class="door-sign" data-bind-house="Sign"></p></div>
          <button class="spot" id="DoorHandle" type="button" style="left: 45.8%; top: 47.5%">
            <span class="spot__dot"></span><span class="spot__label" data-bind-spot="Knock"></span>
          </button>
        </div>
      </div>
      <div class="door-caption">
        <p class="label">batch no. <span data-bind="Age"></span> · <span data-bind="BirthdayLabel"></span></p>
        <p class="door-caption__line" data-bind-house="Line"></p>
      </div>
      <!-- phones only: how to open it full screen from the home screen -->
      <div class="install" id="Install" hidden>
        <p class="install__text" id="InstallText"></p>
        <button class="install__button" id="InstallButton" type="button" data-bind-install="Button" hidden></button>
        <button class="install__dismiss" id="InstallDismiss" type="button" data-bind-install="Dismiss"></button>
      </div>
    </section>

    <!-- Entryway, living room, kitchen and bedroom are built from Rooms.js. -->
    <div id="Rooms"></div>

    <!-- The fridge: French doors with our photos; they swing open on their real hinges to the lit shelves. -->
    <section class="view" id="FridgeView" aria-label="The fridge" hidden>
      <div class="view__backdrop" style="background-image: url(Assets/Rooms/Kitchen.webp)"></div>
      <div class="fridge-stage">
        <div class="fridge-frame" id="FridgeFrame">
          <img class="fridge-frame__photo" src="Assets/Rooms/Fridge.webp" alt="A white fridge with French doors, covered in our photos">
          <div class="fridge-inside" id="FridgeInside" inert>
            <div class="fridge-inside__light"></div>
            <p class="sticker sticker--wall" data-bind-sticker="Property"></p>
            <p class="sticker sticker--roomie" data-bind-sticker="Roomie"></p>
            <p class="sticker sticker--ranoff" data-bind-sticker="RanOff"></p>
            <div class="glass-shelf" style="top: 40%"></div>
            <div class="glass-shelf" style="top: 74%"></div>
            <div class="fridge-jars" id="Jars"></div>
            <button class="crisper" id="Crisper" type="button" aria-label="The crisper drawer"></button>
          </div>
          <div class="fridge-door fridge-door--left" id="DoorLeft">
            <div class="fridge-door__front" id="DoorLeftFront"><div class="door-snaps" id="SnapsLeft"></div></div>
            <div class="fridge-door__back" id="DoorLeftBack" inert>
              <span class="door-bin"></span><span class="door-bin"></span><span class="door-bin"></span>
            </div>
          </div>
          <div class="fridge-door fridge-door--right" id="DoorRight">
            <div class="fridge-door__front" id="DoorRightFront"><div class="door-snaps" id="SnapsRight"></div></div>
            <div class="fridge-door__back" id="DoorRightBack" inert>
              <span class="door-bin"></span><span class="door-bin"></span><span class="door-bin"></span>
            </div>
          </div>
          <p class="sticker sticker--drawer" data-bind-sticker="Freezer"></p>
          <button class="chore-card" id="ChoreChart" type="button" data-bind-sticker="ChoreChart"></button>
          <!-- dot only: a label here would cover the photos -->
          <button class="spot" id="FridgeHandle" type="button" style="left: 50%; top: 31%" aria-label="Open the fridge">
            <span class="spot__dot"></span>
          </button>
        </div>
      </div>
      <button class="spot spot--exit spot--behind" id="Back" type="button">
        <span class="spot__arrow">↓</span><span class="spot__label" id="BackLabel"></span>
      </button>
    </section>

    <!-- The toilet, behind the bathroom's frosted door: she walks in on me brushing my teeth. -->
    <section class="view" id="ToiletView" aria-label="The toilet" hidden>
      <div class="view__backdrop" style="background-image: url(Assets/Photos/Teeth01.webp)"></div>
      <div class="toilet" id="ToiletPhotos"></div>
      <div class="speech" id="ToiletHey" role="status" hidden>
        <span class="label speech__from" data-bind-side="Mine"></span>
        <p class="speech__text" data-bind-toast="Hey"></p>
      </div>
      <button class="spot spot--exit spot--behind" id="ToiletBack" type="button">
        <span class="spot__arrow">↓</span><span class="spot__label" id="ToiletBackLabel"></span>
      </button>
    </section>

    <!-- Bedroom lights out: the ending. -->
    <div class="lights-out" id="LightsOut" hidden>
      <div class="lights-out__label">
        <p data-bind-lights="Made"></p>
        <p class="lights-out__name" data-bind="Name"></p>
        <p data-bind-lights="Best"></p>
      </div>
      <button class="pill pill--soft" id="LightsOn" type="button" data-bind-lights="On"></button>
    </div>
  </div>

  <button class="chip chip--icon chip--fullscreen" id="Fullscreen" type="button" hidden></button>

  <header class="bar" id="Bar" hidden>
    <span class="chip chip--counter" id="JarCounter" hidden></span>
    <button class="chip chip--song" id="SongToggle" type="button" aria-pressed="false" hidden></button>
  </header>

  <div class="caption" aria-live="polite">
    <p class="toast" id="Toast"></p>
    <p class="hint" id="Hint"></p>
  </div>

  <audio id="BackgroundSong" loop preload="none"></audio>

  <dialog class="sheet" id="Sheet" aria-labelledby="SheetTitle">
    <form class="sheet__x-form" method="dialog"><button class="sheet__x" id="SheetClose" type="submit">✕</button></form>
    <div class="sheet__inner">
      <span class="label" id="SheetTag"></span>
      <h2 class="sheet__title" id="SheetTitle"></h2>
      <div class="sheet__body" id="SheetBody"></div>
    </div>
  </dialog>
</body>
</html>
