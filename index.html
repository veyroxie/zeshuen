<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1D1C1A">
  <title>Happy Birthday, Alyssa</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍓</text></svg>">
  <link rel="preload" href="Assets/Fonts/ElyesaHand.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="Assets/Rooms/Door.webp" as="image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=DM+Serif+Display&family=Itim&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Styles.css">
  <link rel="stylesheet" href="House.css">
  <script type="module" src="App.js"></script>
</head>
<body>
  <div class="stage" id="Stage">
    <!-- The front door. Its middle panel is a separate layer so it can swing open. -->
    <section class="view is-current" id="DoorView" aria-label="The front door">
      <div class="view__backdrop" style="background-image: url(Assets/Rooms/Door.webp)"></div>
      <div class="pan" id="DoorPan">
        <div class="scene" style="--ratio: 1200 / 1600">
          <img class="scene__photo" src="Assets/Rooms/Door.webp" alt="Our front door: pale wood panels with a long black handle">
          <div class="door-gap" id="DoorGap"></div>
          <div class="door-leaf" id="DoorLeaf"><p class="door-sign" data-bind-house="Sign"></p></div>
          <button class="spot" id="DoorHandle" type="button" style="left: 45.8%; top: 47.5%">
            <span class="spot__dot"></span><span class="spot__label" data-bind-spot="Handle"></span>
          </button>
        </div>
      </div>
      <div class="door-caption">
        <p class="label">batch no. <span data-bind="Age"></span> · <span data-bind="BirthdayLabel"></span></p>
        <p class="door-caption__line" data-bind-house="Line"></p>
      </div>
    </section>

    <!-- Entryway, living room, kitchen and bedroom are built from Rooms.js. -->
    <div id="Rooms"></div>

    <!-- The fridge: a closed shot with photos on the door, and an open close-up of the shelves. -->
    <section class="view" id="FridgeView" aria-label="The fridge" hidden>
      <div class="view__backdrop" style="background-image: url(Assets/Rooms/Kitchen.webp)"></div>
      <div class="fridge-shot" id="ClosedShot">
        <div class="fridge-frame" id="FridgeFrame">
          <img class="fridge-frame__photo" src="Assets/Rooms/FridgeClosed.webp" alt="A tall silver fridge covered in our photos">
          <div class="fridge-lower" id="LowerSnaps"></div>
          <div class="fridge-inside" id="FridgeInside"></div>
          <div class="fridge-door" id="FridgeDoor">
            <div class="fridge-door__face"></div>
            <div class="fridge-upper" id="UpperSnaps"></div>
          </div>
          <!-- dot only: a label here would cover the photos -->
          <button class="spot" id="FridgeHandle" type="button" style="left: 1.6%; top: 33%" aria-label="Open the fridge">
            <span class="spot__dot"></span>
          </button>
        </div>
      </div>
      <div class="fridge-shot" id="OpenShot" hidden>
        <div class="open-scene" id="OpenScene">
          <img class="open-scene__photo" src="Assets/Rooms/FridgeOpen.webp" alt="The fridge open, its light on">
          <div class="fridge-light"></div>
          <div id="Jars"></div>
          <p class="sticker" style="left: 27%; top: 11.5%; --tilt: -6deg" data-bind-sticker="Logo"></p>
          <p class="sticker" style="left: 31%; top: 64%; --tilt: 4deg" data-bind-sticker="Freezer"></p>
          <p class="sticker" style="left: 67%; top: 41.7%; --tilt: -3deg" data-bind-sticker="DoorBin"></p>
          <button class="spot" id="Crisper" type="button" style="left: 30%; top: 44%">
            <span class="spot__dot"></span><span class="spot__label" data-bind-spot="Crisper"></span>
          </button>
          <button class="open-door" id="OpenDoorEdge" type="button" aria-label="Close the fridge"></button>
        </div>
      </div>
    </section>

    <!-- Bedroom lights out: the ending. -->
    <div class="lights-out" id="LightsOut" hidden>
      <div class="lights-out__label">
        <p data-bind-lights="Made"></p>
        <p class="lights-out__name" data-bind="Name"></p>
        <p data-bind-lights="Best"></p>
      </div>
      <button class="pill pill--soft" id="LightsOn" type="button" data-bind-lights="On"></button>
    </div>
  </div>

  <header class="bar" id="Bar" hidden>
    <button class="chip chip--back" id="Back" type="button" hidden></button>
    <nav class="bar__rooms" id="RoomNav" aria-label="Rooms"></nav>
    <button class="chip chip--song" id="SongToggle" type="button" aria-pressed="false" hidden></button>
  </header>

  <div class="caption" aria-live="polite">
    <p class="toast" id="Toast"></p>
    <p class="hint" id="Hint"></p>
  </div>

  <audio id="BackgroundSong" loop preload="none"></audio>

  <dialog class="sheet" id="Sheet" aria-labelledby="SheetTitle">
    <div class="sheet__inner">
      <span class="label" id="SheetTag"></span>
      <h2 class="sheet__title" id="SheetTitle"></h2>
      <div class="sheet__body" id="SheetBody"></div>
      <form class="sheet__close" method="dialog"><button class="pill" type="submit" data-bind-ui="SheetClose"></button></form>
    </div>
  </dialog>
</body>
</html>
